[package]
name = "brocanth-queue-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The contract as an executable suite. It is written against the contract, so it passes for any compliant backend and catches a Postgres assumption before the second backend does."

[dependencies]
brocanth-queue.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
brocanth-queue-memory.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
missing_docs = "warn"
