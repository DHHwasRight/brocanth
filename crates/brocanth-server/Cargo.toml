[package]
name = "brocanth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "An HTTP entrypoint for a brocanth application, on Tokio."

# `bridge` connects this crate to the brocanth core: an `App` and a `Router`
# become the one async function `Server::run` takes. It is off by default so
# that the standalone shape -- a socket, and one function the application
# writes itself -- stays the crate's default and stays compiling. PLAN.md §8:
# a feature that is off means the code is absent, not a branch that returns
# early, so with the feature off `src/bridge.rs` is not compiled and none of
# its API exists.
#
# What the feature does not buy is a smaller tree. `http` is optional here
# because the bridge is the only thing in this crate that names it directly,
# but `brocanth` and `hyper` both depend on it already, so turning the feature
# off removes no crate from `Cargo.lock`. `brocanth` itself is not optional
# either: `Verb` is this crate's request verb with or without the bridge.
[features]
default = []
bridge = ["dep:http"]
# The WebSocket protocol over `upgrade`: the handshake, the Origin check and
# the frame codec. Off by default, so an application with no socket links
# no codec. `realtime-websocket` turns it on in a generated project.
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]

# Tokio rather than a thread pool, for M:N: a connection costs a task, not an
# OS thread, so idle keep-alives are nearly free and the work-stealing
# scheduler spreads handlers across cores on its own.
#
# It is also the only choice that leaves one concurrency model in the binary.
# brocanth-model is sqlx on runtime-tokio-rustls and brocanth-jobs is Tokio
# directly, so a blocking server would have meant a thread pool calling into an
# async pool -- two schedulers, each unaware of the other's backpressure.
[dependencies]
brocanth.workspace = true
http = { version = "1", optional = true }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
    "server",
    "server-auto",
    "server-graceful",
    "http1",
    "http2",
] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }

# The WebSocket frame codec, for the `websocket` feature only.
#
# RFC 6455 is small to state and easy to get wrong: masking, fragments,
# control frames inside fragments, the close handshake, UTF-8 that is
# checked across fragment boundaries, and limits on all of it. tungstenite
# passes the Autobahn suite and is maintained; a hand-written codec would be
# 600 lines that nothing here tests that well. `default-features = false`
# keeps out the client connector and every TLS stack: this crate brings the
# socket, and the codec only frames bytes. `handshake` adds the
# `Sec-WebSocket-Accept` digest (sha1, data-encoding) and the client
# handshake a test uses; `http` and `httparse` are in the tree already.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
# `SinkExt` and `StreamExt` over the codec's stream. tokio-tungstenite
# depends on it already, with these features.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "websocket"
required-features = ["websocket"]
