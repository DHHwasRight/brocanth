[package]
name = "brocanth-realtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A realtime broker indexed by topic and addressed by audience, so one write is a map lookup rather than one query per subscriber."

# PLAN.md §8 governs, so the refusals are the design.
#
# * **No async runtime, in any configuration.** A bounded queue, a condition
#   variable and a stored `Waker` are in `std`, and that is the whole of what a
#   mailbox needs. `brocanth-jobs` takes tokio because a queue poller is
#   genuinely asynchronous; this crate never waits for anything, so a runtime
#   here would be a dependency taken to express a preference. The result works
#   unchanged under tokio, under `brocanth-storage`'s twenty-line executor, and
#   under a thread per connection.
# * **No SQL driver.** §10 wants `LISTEN/NOTIFY`, and what this crate owns of
#   that is the channel name, the payload and the 8000-byte limit. Opening the
#   connection is the application's, behind the `Notifier` trait. A driver here
#   would also re-open the `links = "sqlite3"` conflict `brocanth-policy`
#   documents, for nothing.
# * **No renderer.** §10 wants a fragment rather than JSON and names `rsx` as
#   the renderer. `FrameEmitter` is the seam; the default emitter is twenty
#   lines and no dependency. An arrow from realtime to the renderer would make
#   every application that broadcasts link a template engine.
# * **No `brocanth`.** Nothing here touches a request, a response or a route.
#   That is also why the transport is not here: see the crate documentation.
[dependencies]
brocanth-events.workspace = true
brocanth-policy.workspace = true
thiserror = "2"

# Only for `listen-notify`. With the feature off neither appears in the tree,
# which is the §8.2 test: "a feature that is off must mean the code is absent".
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `realtime`. It lives beside the crate it writes into a project, and not in
# the CLI, because what it must stay true to is this crate's own surface:
# `Broker::builder`, the four fields of `Config`, the three spellings of
# `Overflow`. A copy of that knowledge in the CLI rots the first time a name
# here changes, and it rots in silence, because nothing compiles the generator
# against this crate.
#
# Optional, and off by default, because two different people read this
# dependency line. An application that broadcasts wants the broker and nothing
# else. The one program that wants the generator is the CLI, which asks for
# `features = ["scaffold"]`. So the code that writes a broker into a new
# project is never linked into an application that merely has one.
brocanth-scaffold = { workspace = true, optional = true }

# `src/admin.rs` is the broker's tab in the backoffice: the indexed/scanned
# split, the four counts under it, and `Broker::audit` as a table.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and intends to keep them. A realtime panel written there
# would put the broker in the binary of every application with a
# backoffice. The admin owns the seam and this crate owns the screen.
#
# Optional and off, so a process that only broadcasts links neither the
# admin nor a template engine.
#
# `default-features = false` keeps the promise at the top of this file.
# `brocanth-admin`'s own `plugin` feature is what pulls in `brocanth`, and
# this crate refuses that arrow. `Admin::dispatch` takes a method, a path
# and form pairs, and needs none of it -- so turning this tab on adds the
# admin and the renderer, and still no core, no request and no route.
# `cargo tree -p brocanth-realtime --features admin` is the check.
#
# Spelled out rather than `workspace = true`, and that is not an oversight:
# cargo ignores `default-features = false` on a workspace dependency whose
# table in the root manifest does not mention `default-features`, with a
# warning, so inheriting it here would silently pull `brocanth` back in.
# Setting it in the root table instead would turn the admin's plugin off
# for every other crate. One crate wants something different from the
# default, so one crate says so.
brocanth-admin = { path = "../brocanth-admin", version = "0.1.0", optional = true, default-features = false }

# The screen, compiled in by the macro. Only reachable through `admin`: a
# broker does not render HTML. Same spelling the admin uses, so one copy is
# linked.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

# The panel's trait is async and object-safe, which `async fn` in a trait
# still is not. Same spelling the admin uses, so one copy is linked.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
# The HTTP test client, for `tests/panel.rs` only.
#
# It brings `brocanth` into the *test* build, which the dependency list
# above refuses for a library build, and the trade is deliberate: the
# alternative is a panel test that searches the page for a substring, which
# is the habit `brocanth-test` exists to end (`docs/framework-gaps.md` §G6).
# A dev-dependency is linked into no application and changes nothing an
# application resolves. `tests/panel.rs` uses `Html` alone -- it drives the
# real `Admin` directly, because this crate mounts no routes.
brocanth-test.workspace = true

# The test policy is written with `policy!` (PLAN.md §12 item 10), so the
# audience inversion is tested on what the macro emits.
brocanth-policy = { workspace = true, features = ["macro"] }

[features]
default = []
# Multi-process realtime over Postgres `LISTEN/NOTIFY` (§10). Off by default
# because a single-process deployment must not link a JSON codec to broadcast
# in memory.
listen-notify = ["dep:serde", "dep:serde_json"]

# The scaffold module, for `brocanth create`. Off by default: see the
# dependency line above for why the generator is not an application's
# business.
scaffold = ["dep:brocanth-scaffold"]

# The backoffice tab. Off, like every other way out of this crate.
admin = ["dep:brocanth-admin", "dep:rsx", "dep:async-trait"]

[lints.rust]
missing_docs = "warn"
