[package]
name = "brocanth-storage"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "File storage for brocanth: one trait over a local disk, Postgres, S3 or Google Cloud Storage, content-addressed names and derived image variants."
readme = "README.md"

[dependencies]
# No `brocanth` here. §8 points the arrow from a plugin to the core, and this
# crate does not even reach the core: it is a storage contract, so the HTTP
# half that mounts it depends on both and this depends on neither.

# The trait is async and object-safe. `async fn` in a trait is still not
# object-safe, and an application holding one backend behind `Arc<dyn Storage>`
# is the normal case, so `async-trait` it is — the same choice `brocanth-auth`
# made for `AuthStore`.
async-trait = "0.1"

# SHA-256 addresses an object and HMAC-SHA256 signs a file token. Same
# RustCrypto crates `brocanth-auth` already uses, so an application that links
# both links one copy.
sha2 = "0.11"
hmac = "0.13"
# Constant-time equality. `==` on a MAC short-circuits on the first differing
# byte, which is enough to forge one byte at a time.
subtle = "2.6"
# The OS CSPRNG, for a token key, a random address and a temporary file name.
getrandom = "0.4"
base64 = "0.23"
thiserror = "2"

# A `Bucket` body is bytes or a stream of them. `bytes` is the chunk type
# every async HTTP stack already speaks, and `futures-core` is the `Stream`
# trait alone: no executor, no combinators, no runtime. Both are a few
# hundred lines and already in the lock through `sqlx` and `reqwest`.
bytes = "1"
futures-core = "0.3"

# The S3 and Google Cloud Storage clients, behind `s3` and `gcs`, off by
# default for the reason `sqlx` is: a feature that is off means the code is
# absent (§8.2). One crate for both clouds, from the Apache Arrow project:
# streaming put and get, ranges, listing, conditional create and signed
# URLs, on the tokio and reqwest 0.13 the workspace already links.
# `docs/object-storage.md` §4 has the comparison with the two vendor SDKs.
# No default features: its `fs` backend would be a second disk store
# beside `FsBucket`, without the `fsync`, the `0600` and the sidecar.
# 0.14.2 at least: `Signer::signed_url_opts` signs the response overrides a
# redirected download carries (`docs/object-storage.md` §9.2, D35).
object_store = { version = "0.14.2", default-features = false, optional = true }
# The combinators a cloud backend needs to read a list and a body. Only with
# `s3` or `gcs`: the disk code polls a stream by hand.
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# The image codecs, and the reason they are optional is §8.2: a feature that is
# off must mean the code is absent. `image` pulls png, jpeg, gif and webp
# decoders — hundreds of kilobytes and a wide parsing surface — and an
# application that stores PDFs must not link a PNG decoder. Default features
# are off for the same reason: we take four formats, not twelve, and no rayon,
# because a storage plugin must not start a thread pool.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
], optional = true }

# The Postgres backend, optional for the same reason the codecs are. A SQL
# driver, a connection pool, a TLS stack and a reactor is the largest tree in
# this crate by a wide margin, and §8.2 asks that a feature which is off means
# the code is absent rather than branched around. With `postgres` off there is
# no `sqlx` here.
#
# Version 0.9, with no default features, because that is the version `sea-orm`
# 2.0.4 and `brocanth-jobs` already resolve to in this workspace. A second
# minor version of `sqlx` in one workspace is a second `libpq`-free driver, a
# second pool and — with the TLS features — a second native library, which is
# how a resolution failure reaches crates that never asked for a database.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
], optional = true }

# `LocalDisk` runs its `std::fs` calls, each write with an `fsync`, on
# Tokio's blocking pool when a Tokio runtime calls it, and a thumbnail renders
# there too. A reactor thread that waits on a disk or a decoder stops every
# other request it holds. Only `rt`: no reactor, no timer, no thread of its
# own; the application's runtime does the work. Outside a runtime the calls
# run in place, so the tests in `src/rt.rs` need none. `variants` adds `sync`
# for the semaphore that bounds concurrent renders. Optional, behind the
# default `runtime` feature, so that the CLI, which links this crate for its
# scaffold module alone, links no Tokio (`brocanth-cli/tests/lean.rs`).
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `storage`. It lives beside the crate it writes into a project, and not in
# the CLI, because what it must stay true to is this crate's own surface:
# `LocalDisk::open`, `with_hash_key`, and the two keys one secret derives.
# A copy of that knowledge in the CLI rots the first time a name here
# changes, and it rots in silence, because nothing compiles the generator
# against this crate.
#
# Optional, and off by default, because two different people read this
# dependency line. An application that stores files wants the store and
# nothing else. The one program that wants the generator is the CLI, which
# asks for `features = ["scaffold"]`. So the code that writes a store into a
# new project is never linked into an application that merely has one.
brocanth-scaffold = { workspace = true, optional = true }

# `routes`: the HTTP edge, an upload route and a download route as request
# hooks. The one feature that reaches the core, and it is off: a store used
# from a job or a command links no server. `brocanth-input` reads the
# multipart body, so this crate parses none of its own.
brocanth = { workspace = true, optional = true }
http = { version = "1", optional = true }
brocanth-input = { workspace = true, optional = true }

[dev-dependencies]
# A real directory for the disk tests, removed when the test ends. Nothing
# else: the tests drive the async trait through a twenty-line executor in
# `src/rt.rs`, because a runtime that exists only to make a test compile is
# still a runtime in the tree (PLAN §8.2, and `brocanth-admin` set the
# precedent). The Postgres tests need a real reactor and get it from the
# `tokio` above, with the reactor `sqlx/runtime-tokio` turns on — a
# dev-dependency cannot be optional, and one declared here would be compiled by
# every `cargo test` in a tree that asked for no database.
tempfile = "3"
# This crate with the routes and the image codecs on, so `cargo test -p
# brocanth-storage` runs the route tests and the thumbnail tests. The route
# tests drive the hooks with the same kind of thirty-line executor, so no
# runtime joins the tree here either.
brocanth-storage = { path = ".", features = ["routes", "variants", "scaffold"] }
# The generator, for the module's own goldens (`tests/scaffold.rs`).
brocanth-cli = { path = "../brocanth-cli" }
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-test.workspace = true
brocanth-middleware.workspace = true
# Fetches a signed URL in the S3 and GCS conformance tests, which only run
# against a server (`docs/object-storage.md` §7). Already in the lock.
reqwest = { version = "0.13", default-features = false }

[features]
# `runtime` only. Parsing a size specification, caching a derived variant
# and serving one are all here with `variants` off; only the pixels need
# `image`.
default = ["runtime"]

# The blocking pool for `LocalDisk` and for renders. Without it, the store
# runs its disk calls in place. The CLI turns it off with
# `default-features = false`, because it links this crate for the scaffold
# module alone.
runtime = ["dep:tokio"]
variants = ["runtime", "dep:image", "tokio/sync"]

# The upload and download routes, as request hooks. See `crate::routes`.
routes = ["dep:brocanth", "dep:http", "dep:brocanth-input"]

# The scaffold module, for `brocanth create`. Off by default: see the
# dependency line above for why the generator is not an application's
# business.
scaffold = ["dep:brocanth-scaffold"]

# Objects in Postgres rather than on a disk, in `bytea` columns. See
# [`crate::postgres`] for the schema and for why it is `bytea` and not a large
# object. `tls-rustls-ring` rather than a native TLS stack, because a native
# one is the other half of the resolution failure the comment above is about:
# two crates in one workspace asking for two different OpenSSL bindings is a
# link error nobody can fix from their own `Cargo.toml`.
postgres = ["runtime", "dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-ring"]

# Objects in an S3 bucket, or an S3-compatible one (MinIO, R2), and in a
# Google Cloud Storage bucket. See [`crate::cloud`]. `http` for the method a
# signed URL is for.
s3 = ["runtime", "dep:object_store", "object_store/aws", "dep:futures-util", "dep:http"]
gcs = ["runtime", "dep:object_store", "object_store/gcp", "dep:futures-util", "dep:http"]

[lints.rust]
missing_docs = "warn"
