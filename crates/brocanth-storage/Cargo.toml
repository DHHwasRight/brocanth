[package]
name = "brocanth-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "File storage for brocanth: one trait, a local-disk backend, content-addressed names and derived image variants."

[dependencies]
# No `brocanth` here. §8 points the arrow from a plugin to the core, and this
# crate does not even reach the core: it is a storage contract, so the HTTP
# half that mounts it depends on both and this depends on neither.

# The trait is async and object-safe. `async fn` in a trait is still not
# object-safe, and an application holding one backend behind `Arc<dyn Storage>`
# is the normal case, so `async-trait` it is — the same choice `brocanth-auth`
# made for `AuthStore`.
async-trait = "0.1"

# SHA-256 addresses an object and HMAC-SHA256 signs a file token. Same
# RustCrypto crates `brocanth-auth` already uses, so an application that links
# both links one copy.
sha2 = "0.11"
hmac = "0.13"
# Constant-time equality. `==` on a MAC short-circuits on the first differing
# byte, which is enough to forge one byte at a time.
subtle = "2.6"
# The OS CSPRNG, for a token key, a random address and a temporary file name.
getrandom = "0.4"
base64 = "0.23"
thiserror = "2"

# The image codecs, and the reason they are optional is §8.2: a feature that is
# off must mean the code is absent. `image` pulls png, jpeg, gif and webp
# decoders — hundreds of kilobytes and a wide parsing surface — and an
# application that stores PDFs must not link a PNG decoder. Default features
# are off for the same reason: we take four formats, not twelve, and no rayon,
# because a storage plugin must not start a thread pool.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
], optional = true }

# The Postgres backend, optional for the same reason the codecs are. A SQL
# driver, a connection pool, a TLS stack and a reactor is the largest tree in
# this crate by a wide margin, and §8.2 asks that a feature which is off means
# the code is absent rather than branched around. With `postgres` off there is
# no `sqlx` and no `tokio` here: `cargo tree -p brocanth-storage -e normal
# --depth 1` lists seven crates, exactly as it did before this backend existed.
#
# Version 0.9, with no default features, because that is the version `sea-orm`
# 2.0.4 and `brocanth-jobs` already resolve to in this workspace. A second
# minor version of `sqlx` in one workspace is a second `libpq`-free driver, a
# second pool and — with the TLS features — a second native library, which is
# how a resolution failure reaches crates that never asked for a database.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
], optional = true }

# Named here only so the Postgres tests can build a reactor to drive `sqlx`
# on: `src/rt.rs` runs a future on the calling thread and has no I/O driver, so
# it cannot drive a socket. This adds nothing to the tree that
# `sqlx/runtime-tokio` has not already put there, and it is optional so that a
# build without `postgres` has neither.
tokio = { version = "1", default-features = false, features = [
    "rt",
], optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `storage`. It lives beside the crate it writes into a project, and not in
# the CLI, because what it must stay true to is this crate's own surface:
# `LocalDisk::open`, `with_hash_key`, and the two keys one secret derives.
# A copy of that knowledge in the CLI rots the first time a name here
# changes, and it rots in silence, because nothing compiles the generator
# against this crate.
#
# Optional, and off by default, because two different people read this
# dependency line. An application that stores files wants the store and
# nothing else. The one program that wants the generator is the CLI, which
# asks for `features = ["scaffold"]`. So the code that writes a store into a
# new project is never linked into an application that merely has one.
brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
# A real directory for the disk tests, removed when the test ends. Nothing
# else: the tests drive the async trait through a twenty-line executor in
# `src/rt.rs`, because a runtime that exists only to make a test compile is
# still a runtime in the tree (PLAN §8.2, and `brocanth-admin` set the
# precedent). The Postgres tests need a real reactor and get it from the
# optional `tokio` above, which the `postgres` feature turns on — a
# dev-dependency cannot be optional, and one declared here would be compiled by
# every `cargo test` in a tree that asked for no database.
tempfile = "3"

[features]
# Empty, and that is the rule rather than an oversight. Parsing a size
# specification, caching a derived variant and serving one are all here with
# the feature off; only the pixels need `image`.
default = []
variants = ["dep:image"]

# The scaffold module, for `brocanth create`. Off by default: see the
# dependency line above for why the generator is not an application's
# business.
scaffold = ["dep:brocanth-scaffold"]

# Objects in Postgres rather than on a disk, in `bytea` columns. See
# [`crate::postgres`] for the schema and for why it is `bytea` and not a large
# object. `tls-rustls-ring` rather than a native TLS stack, because a native
# one is the other half of the resolution failure the comment above is about:
# two crates in one workspace asking for two different OpenSSL bindings is a
# link error nobody can fix from their own `Cargo.toml`.
postgres = ["dep:sqlx", "dep:tokio", "sqlx/postgres", "sqlx/tls-rustls-ring"]

[lints.rust]
missing_docs = "warn"
