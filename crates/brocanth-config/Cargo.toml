[package]
name = "brocanth-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Configuration for brocanth: TOML, JSON, YAML and the environment, deep merge, plugin-contributed defaults, and a provenance on every value — a plugin, because an application configured from its environment should not link a TOML parser."

# PLAN.md §8.2: "Feature flags gate compilation, not behaviour. A feature that
# is off must mean the code is absent, not that a branch returns early." Every
# parser is therefore optional and every one is gated.
#
# Note what `toml` is taken with: `default-features = false`, so `parse` arrives
# only through the `toml` feature below. The value model of this crate is its
# own (`src/value.rs`), so an application that reads only YAML pulls neither
# `toml_parser` nor `winnow`. That is the whole point of not building the model
# on `toml::Value`, which the crate used to do.
[dependencies]
brocanth.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# TOML. `DeTable::parse` hands back every key and value in a `Spanned`, which is
# what a provenance with a line number needs; `toml::Value` carries no position
# and would not do.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "parse",
], optional = true }
serde_spanned = { version = "1.1", default-features = false, optional = true }

# JSON. Chosen over `serde_json` because its AST carries a byte range on every
# node, and `serde_json` reports a position only in an error.
jsonc-parser = { version = "0.34", default-features = false, optional = true }

# YAML. `serde_yaml` was deprecated by its author in March 2024, and
# `serde_yaml_ng` (May 2024) and `serde_norway` (December 2024) have not
# published since; none of the three reports the position of a value in any
# case. `saphyr` is maintained, is YAML 1.2 compliant, and puts a `Span` on
# every node.
saphyr = { version = "0.2", default-features = false, optional = true }

# `src/admin.rs` is the **Settings** tab in the backoffice: every section,
# every key, the value, and the file and line that decided it.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and no parser. A settings panel written there would put serde
# and three format crates in the binary of every application that has a
# backoffice. The admin owns the seam and this crate owns the screen.
#
# Optional and off, so a service that reads a TOML file and serves no
# backoffice links neither the admin nor rsx.
brocanth-admin = { workspace = true, optional = true }

# The template, compiled in by the macro. Only reachable through `admin`: a
# configuration loader does not render HTML.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

# `Panel::render` is an `async fn` in a trait that is held behind a `dyn`,
# which `async fn` in a trait still is not. Same spelling the admin uses, so
# one copy is linked.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

# This crate, as a dev-dependency on itself, with `admin` on, so the panel's
# test renders the real screen through the real `Admin` rather than asserting
# on a context struct. A screen that compiles and prints a password is the
# failure worth catching, and `tests/panel.rs` is where that is caught.
brocanth-config = { path = ".", features = ["admin"] }

# The HTML assertions. `Html::assert_no_text("hunter2")` is the redaction
# test, and it reads the rendered page rather than a context struct.
brocanth-test.workspace = true

# No tokio. `Panel::render` is async and `brocanth_admin::rt::block_on` drives
# it: thirty lines of `std`, and the reason is the one this crate already
# gives for every parser. A dependency that appears only to make a test
# compile is still a dependency in the tree.

[features]
default = ["toml"]
# TOML, through `toml` 1.1.
toml = ["dep:toml", "dep:serde_spanned"]
# JSON, with comments and trailing commas, through `jsonc-parser` 0.34.
json = ["dep:jsonc-parser"]
# YAML 1.2, through `saphyr` 0.2.
yaml = ["dep:saphyr"]

# The backoffice tab. Off, like every parser is until it is asked for. `admin`
# off means the code is absent and not merely unreachable: `src/admin.rs` and
# the template beside it are `#[cfg]`-ed out of the crate entirely. It needs
# no format feature, because the panel reads a loaded `Config` and does not
# parse anything.
admin = ["dep:brocanth-admin", "dep:rsx", "dep:async-trait"]

[lints.rust]
missing_docs = "warn"
