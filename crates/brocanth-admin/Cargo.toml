[package]
name = "brocanth-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Django-admin-shaped backoffice for brocanth, with every screen configured through rsx templates."

# Four dependencies, and three of them are small. There is no SQL driver and no
# ORM here: PLAN.md §8.4 says the ORM is recommended and absent, so this crate
# takes a `dyn AdminData` the application supplies and never learns what is
# behind it. There is no authentication scheme either, for the same reason —
# §8 forbids assuming one, so the admin takes a policy instead (and denies
# everything until it is given one).
[features]
# On by default: a brocanth plugin should be a brocanth plugin out of the box.
# It is a feature rather than a plain dependency because the admin is useful
# behind any server — `Admin::dispatch` takes a method, a path and form pairs —
# and §8.2 says a feature that is off means the code is absent. With `plugin`
# off, `brocanth` is not in the tree at all.
default = ["plugin"]
plugin = ["dep:brocanth", "dep:http"]
# The module `brocanth create` lists under the key `admin`, and `admin-model`
# beside it. Off by default: the one program that wants it is the CLI, which
# asks for `default-features = false, features = ["scaffold"]`. It writes
# text and reads nothing from this crate, so it needs neither `plugin` nor
# the core.
scaffold = ["dep:brocanth-scaffold"]

[dependencies]
brocanth = { workspace = true, optional = true }

# Only with `plugin`, and only because the routes this crate contributes
# answer with an `http::Response` -- the core's `Response` is an alias for
# one. Same major version as the core, so there is one copy in the binary.
http = { version = "1", optional = true }
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0" }
async-trait = "0.1"
thiserror = "2"

# Row-level authorisation, PLAN.md §9 and §12 item 9. The algebra and the
# witness are that crate's; this one erases them per model, because the
# admin is one screen serving every model and cannot be generic over an
# entity. Its only dependency is `thiserror`, which is already here, so the
# admin still links no SQL driver and no ORM: a policy compiles to SQL text
# and a bind list, and the data source runs it.
brocanth-policy = { workspace = true }
brocanth-middleware = { workspace = true }

# Optional, and off. See the `scaffold` feature.
brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
# For the compile-fail cases under tests/ui: an admin resource with no
# policy must not compile. `brocanth-resource` set the precedent.
trybuild = "1"

[lints.rust]
missing_docs = "warn"
