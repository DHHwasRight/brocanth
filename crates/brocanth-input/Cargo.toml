[package]
name = "brocanth-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The entrance: a request becomes a struct the handler asked for, or an answer that says why not."

[dependencies]
brocanth = { workspace = true, optional = true }
brocanth-server = { workspace = true, optional = true }
zod = { workspace = true, features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `input`. It lives beside the crate it writes into a project, and not in the
# CLI, because everything it writes is a statement about this crate and about
# zod: that `Entrance` takes three parts of a request, that a `Faults` is
# every fault and not the first, and that 422 is the status a refused body
# gets. A copy of that in the CLI rots the first time a name here changes.
brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
# `tests/scaffold.rs`: the module, generated into a project by the CLI's
# own generator and checked with `brocanth_scaffold::testing`. A cycle
# through dev-dependencies, which cargo allows: the CLI takes this crate's
# `scaffold` side.
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-cli = { path = "../brocanth-cli" }

[features]
default = ["runtime"]
# The entrance hook: everything but the scaffold module. The CLI turns it off
# and takes `scaffold` alone, so `brocanth create` links no server.
runtime = ["dep:brocanth", "dep:brocanth-server", "dep:zod", "dep:serde_json"]
scaffold = ["dep:brocanth-scaffold"]

[lints.rust]
missing_docs = "deny"
