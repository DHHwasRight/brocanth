[package]
name = "brocanth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The brocanth command line."

# The generator as a library, for the tests of a module crate:
# `brocanth_cli::testing::generate`. Its unit tests run in the binary.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "brocanth"
path = "src/main.rs"

[dependencies]

# The cache, for its scaffold module alone. `brocanth create` offers a module
# that lives in the crate it writes, and `features = ["scaffold"]` is the
# whole of the opt-in: the feature is off everywhere else, so no application
# links a generator.
brocanth-cache = { path = "../brocanth-cache", version = "0.1.0", default-features = false, features = ["scaffold"] }

# The database pool, for its scaffold module alone, on the same terms.
brocanth-db = { path = "../brocanth-db", version = "0.1.0", default-features = false, features = ["scaffold"] }

# First-party page-view counts, for its scaffold module alone, on the same
# terms.
brocanth-analytics = { workspace = true, default-features = false, features = [
    "scaffold",
] }

# The broker, on the same terms. It offers `realtime` and no transport: the
# core's `Response` is a finished `Vec<u8>` and every response hook is
# specified to see one, so server-sent events are a change to the hook
# contract rather than a module that can be written today.
brocanth-auth = { path = "../brocanth-auth", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-jobs = { path = "../brocanth-jobs", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-client = { path = "../brocanth-client", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-input = { path = "../brocanth-input", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-middleware = { path = "../brocanth-middleware", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-gtag = { path = "../brocanth-gtag", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-i18n = { path = "../brocanth-i18n", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-openapi = { path = "../brocanth-openapi", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-robots = { workspace = true, features = ["scaffold"] }
brocanth-sanitize = { path = "../brocanth-sanitize", version = "0.1.0", default-features = false, features = ["scaffold"] }
brocanth-policy = { workspace = true, features = ["scaffold"] }
# `default-features = false` keeps `regex`, the `Validate` proc macro and a
# second copy of the core out of the CLI. What a generated project gets is
# unaffected: that comes from `Dep::brocanth(..)`, not from this line.
brocanth-resource = { workspace = true, default-features = false, features = [
    "scaffold",
] }
brocanth-schema = { workspace = true, default-features = false, features = [
    "scaffold",
] }
brocanth-storage = { workspace = true, features = ["scaffold"] }
# The backoffice. `default-features = false` keeps the `RouteSource` and the
# core's `http` out of the CLI; the module writes text and reads none of it.
brocanth-admin = { path = "../brocanth-admin", version = "0.1.0", default-features = false, features = [
    "scaffold",
] }
brocanth-realtime = { workspace = true, features = ["scaffold"] }
# Logs, probes and metrics. The default instead of `logging`, and never
# beside it: `create` refuses the pair.
brocanth-observe = { workspace = true, features = ["scaffold"] }

# `string` so a command name discovered at run time -- a project's own, read
# out of its built binary for `--help` -- can be an owned String.
brocanth-scaffold.workspace = true
clap = { version = "4", features = ["derive", "string"] }
# Colour, decided once in src/ui.rs. anstyle is the vocabulary and anstream is
# the stream that strips it when nobody is watching. Not `colored`: MPL-2.0
# would be the only copyleft licence in the tree.
anstyle = "1"
anstream = "1"
# Display width, so a wide character does not shear a column. Was free while
# `indicatif` was here; `indicatif` went with the progress bars, which went
# with the commands that had phases to report.
unicode-width = "0.2"
# The chooser `brocanth create` opens when an answer is missing. Default
# features off: they pull in every widget plus three backends we never build
# against. Four widgets and the crossterm backend is the whole of it.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
    "layout-cache",
    "underline-color",
] }
cargo_metadata = "0.23.1"
# `brocanth add` appends to `Cargo.toml` and `config/<env>.toml` rather than
# rewriting them: both are files the developer also writes in, so the only
# honest edit is one that leaves every other byte alone. That rules out
# parse-and-reserialise, which is what `toml` would give. Already in the lock
# file through cargo_metadata, so it costs the build nothing new.
toml_edit = "0.25"

# `vendor/dpswap.min.js` is embedded with include_str! rather than listed
# here. See vendor/README.md: a scaffold that needs the network to finish is
# a scaffold that fails on a train.

[dev-dependencies]
# The core and the configuration loader, for tests only. The tool writes
# text and links neither (tests/lean.rs holds that line). The tests use them
# to check that what it writes is what the real crates accept: a generated
# config/<env>.toml is parsed and validated by the loader the application
# runs, so a scaffold whose own loader would reject its own file cannot ship.
brocanth.workspace = true
brocanth-config = { path = "../brocanth-config", version = "0.1.0" }
