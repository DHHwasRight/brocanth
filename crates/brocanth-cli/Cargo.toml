[package]
name = "brocanth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The brocanth command line."

[[bin]]
name = "brocanth"
path = "src/main.rs"

[dependencies]
brocanth.workspace = true
# The configuration plugin, because `brocanth create` writes a config/<env>.toml
# and a scaffold whose own loader would reject its own file must not ship: the
# generated document is parsed and validated by the real crate in a test. The
# core's no-hidden-dependencies rule is the core's; this is the tool.
brocanth-config = { path = "../brocanth-config", version = "0.1.0" }

# The cache, for its scaffold module alone. `brocanth create` offers a module
# that lives in the crate it writes, and `features = ["scaffold"]` is the
# whole of the opt-in: the feature is off everywhere else, so no application
# links a generator.
brocanth-cache = { workspace = true, features = ["scaffold"] }

# The broker, on the same terms. It offers `realtime` and no transport: the
# core's `Response` is a finished `Vec<u8>` and every response hook is
# specified to see one, so server-sent events are a change to the hook
# contract rather than a module that can be written today.
brocanth-auth = { workspace = true, features = ["scaffold"] }
brocanth-jobs = { workspace = true, features = ["scaffold"] }
brocanth-client = { workspace = true, features = ["scaffold"] }
brocanth-input = { workspace = true, features = ["scaffold"] }
brocanth-middleware = { workspace = true, features = ["scaffold"] }
brocanth-openapi = { workspace = true, features = ["scaffold"] }
brocanth-policy = { workspace = true, features = ["scaffold"] }
# `default-features = false` keeps `regex`, the `Validate` proc macro and a
# second copy of the core out of the CLI. What a generated project gets is
# unaffected: that comes from `Dep::brocanth(..)`, not from this line.
brocanth-resource = { workspace = true, default-features = false, features = [
    "scaffold",
] }
brocanth-schema = { workspace = true, default-features = false, features = [
    "scaffold",
] }
brocanth-storage = { workspace = true, features = ["scaffold"] }
brocanth-realtime = { workspace = true, features = ["scaffold"] }

# `string` so a command name discovered at run time -- a project's own, read
# out of its built binary for `--help` -- can be an owned String.
brocanth-scaffold.workspace = true
clap = { version = "4", features = ["derive", "string"] }
# Colour, decided once in src/ui.rs. anstyle is the vocabulary and anstream is
# the stream that strips it when nobody is watching. Not `colored`: MPL-2.0
# would be the only copyleft licence in the tree.
anstyle = "1"
anstream = "1"
# Display width, so a wide character does not shear a column. Was free while
# `indicatif` was here; `indicatif` went with the progress bars, which went
# with the commands that had phases to report.
unicode-width = "0.2"
# The chooser `brocanth create` opens when an answer is missing. Default
# features off: they pull in every widget plus three backends we never build
# against. Four widgets and the crossterm backend is the whole of it.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
    "layout-cache",
    "underline-color",
] }
cargo_metadata = "0.23.1"
# `brocanth add` appends to `Cargo.toml` and `config/<env>.toml` rather than
# rewriting them: both are files the developer also writes in, so the only
# honest edit is one that leaves every other byte alone. That rules out
# parse-and-reserialise, which is what `toml` would give. Already in the lock
# file through cargo_metadata, so it costs the build nothing new.
toml_edit = "0.25"

# `vendor/dpswap.min.js` is embedded with include_str! rather than listed
# here. See vendor/README.md: a scaffold that needs the network to finish is
# a scaffold that fails on a train.
