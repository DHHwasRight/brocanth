[package]
name = "brocanth-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The database layer for brocanth: a Postgres pool with session settings, and sea-query statements run through sqlx. No entities."
readme = "README.md"

# The core never names this crate. An application that does not ask for a
# database links none of this (PLAN.md §8).
[dependencies]
# `sqlx` 0.9, the version `sea-orm` 2.0.4 resolves to and every other crate
# in this workspace pins. One driver and one pool implementation in the tree,
# so `brocanth-model` can wrap the pool this crate opens.
#
# `tls-rustls-ring` is the TLS stack `brocanth-cache`, `brocanth-auth` and
# `brocanth-jobs` take. A second stack would be a second copy of rustls.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring",
    "json",
] }

# The query builder, without its entity layer. `1.0` is the line `sea-orm`
# 2.0.4 uses, so this adds no second copy. Postgres is the only backend.
#
# `with-json`, `with-chrono` and `with-uuid` let a statement bind those
# values. All three crates are already in the lock through `sea-orm`.
sea-query = { version = "1.0", default-features = false, features = [
    "derive",
    "backend-postgres",
    "with-json",
    "with-chrono",
    "with-uuid",
] }

# The bridge that turns sea-query `Values` into sqlx arguments. Version 0.9
# targets sqlx 0.9. Its value features mirror the ones above.
sea-query-sqlx = { version = "0.9", default-features = false, features = [
    "sqlx-postgres",
    "with-json",
    "with-chrono",
    "with-uuid",
] }

serde_json = "1"
thiserror = "2"

# `DbConfig: Deserialize`, for a config plugin that reads a `[db]` section.
# Off: a service configured in code has no use for it.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
serde = ["dep:serde"]

[lints.rust]
missing_docs = "warn"
