[package]
name = "brocanth-middleware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The middleware every application rewrites: proxy headers, method override, canonical host, content types, CORS, CSRF, security headers and rate limiting."

# Five dependencies by default, and every one is already in the workspace
# tree: `brocanth` and `http` in the core's own, `getrandom`, `sha2` and
# `base64` in `brocanth-auth`'s. This crate is a set of hooks and nothing else, so anything it
# links is a cost every application that wants a canonical-host redirect
# also pays.
[dependencies]
brocanth.workspace = true
http = "1"

# The OS CSPRNG, and the reason the count above went from two to three: a
# CSRF token a visitor can predict is not a CSRF token, and std has no
# randomness to mint one from. `brocanth-auth` and `brocanth-storage`
# already take the same version, so an application that links two of the
# three links one copy. The constant-time comparison is written here
# rather than taken from `subtle`, because the one this needs folds the
# lengths in as well and does not return early on them.
getrandom = "0.4"

# The Content-Security-Policy hashes. dp-swap's two scripts are inlined
# as compile-time constants, and a `'sha256-...'` source is what lets them
# run without `'unsafe-inline'`. `brocanth-auth` and `brocanth-storage`
# take the same two versions, so this adds no second copy. The rate
# limiter uses the same digest to keep a session cookie out of its store.
sha2 = "0.11"
base64 = "0.23"

# `config`: the configuration types deserialise, so a `[security_headers]`
# or `[rate_limit]` section of a brocanth-config file builds one. Off, so
# an application that builds its configuration in code links no serde.
serde = { version = "1", features = ["derive"], optional = true }

# `postgres`: the rate limiter's shared store, one UNLOGGED table. The same
# `sqlx` 0.9 and the same features `brocanth-queue-postgres` takes, so an
# application with the queue links one driver.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring",
], optional = true }

[dev-dependencies]
# `tests/dp.rs` drives the CSRF hook and the dp-swap hook through the real
# pipeline, and re-renders a form with its faults the way an application
# does. None of this reaches a library build.
brocanth-test.workspace = true
brocanth-input.workspace = true
brocanth-server.workspace = true
zod = { workspace = true, features = ["json"] }
# `tests/config.rs` reads both sections out of a real TOML document.
brocanth-config.workspace = true
# `tests/rate_limit_postgres.rs`, skipped without a database.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
# This crate, with both optional features on, so `cargo test -p
# brocanth-middleware` runs the configuration and Postgres tests rather
# than compiling them out. The pattern `brocanth-config` uses for `admin`.
brocanth-middleware = { path = ".", features = ["config", "postgres"] }

[features]
default = []
scaffold = ["dep:brocanth-scaffold"]
# The configuration types deserialise from a brocanth-config section.
config = ["dep:serde"]
# `rate_limit::PgStore`, the shared counter store.
postgres = ["dep:sqlx"]

[dependencies.brocanth-scaffold]
workspace = true
optional = true
