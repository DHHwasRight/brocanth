[package]
name = "brocanth-flags"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Feature flags for brocanth: on for everyone, a percentage of users, or a list of users and groups. Rows in your Postgres, read from an in-process copy."
readme = "README.md"

# Its own crate, because no crate in the workspace owns "a switch the
# operator turns while the process runs": `brocanth-config` is read once at
# start, and `brocanth-cache` forgets. A flag is a durable row and a
# synchronous read.
#
# Everything the application runs is behind `runtime`, on by default. The
# CLI takes this crate with `default-features = false, features =
# ["scaffold"]`, so the generator links no core, no tokio and no driver.
[dependencies]
brocanth = { workspace = true, optional = true }

# The store is a trait object behind an `Arc`, so its methods are boxed
# futures. The same crate `brocanth-cache` and `brocanth-admin` use.
async-trait = { version = "0.1", optional = true }

# The task that reloads the copy, on the runtime a server already has.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "time",
    "sync",
], optional = true }

# `postgres`: `PgStore`, one table in the database the `db` module opened.
brocanth-db = { workspace = true, optional = true }

# `config`: `FlagsConfig` reads from a `[flags]` section.
serde = { version = "1", features = ["derive"], optional = true }

# `admin`: `FlagsPanel`, a tab in `brocanth-admin`. Off, so a worker or an
# application without the backoffice links no admin.
brocanth-admin = { workspace = true, optional = true }

# `scaffold`: the module `brocanth create` offers as `flags`.
brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# This crate, with every feature on, so `cargo test -p brocanth-flags` runs
# the panel and Postgres tests instead of compiling them out.
brocanth-flags = { path = ".", features = ["postgres", "config", "admin", "scaffold"] }
brocanth-scaffold = { workspace = true, features = ["testing"] }
# The generator, for the module's golden. A cycle through dev-dependencies,
# which cargo allows: the CLI takes this crate's `scaffold` side.
brocanth-cli = { path = "../brocanth-cli" }

[features]
default = ["runtime", "postgres"]
# The rules, the in-process copy, the plugin and the memory store: what an
# application links.
runtime = ["dep:brocanth", "dep:async-trait", "dep:tokio"]
postgres = ["runtime", "dep:brocanth-db"]
config = ["runtime", "dep:serde"]
admin = ["runtime", "dep:brocanth-admin"]
scaffold = ["dep:brocanth-scaffold"]

[lints.rust]
missing_docs = "warn"
