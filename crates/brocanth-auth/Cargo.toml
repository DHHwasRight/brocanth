[package]
name = "brocanth-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authentication for brocanth: OAuth 2.0 and OIDC with mandatory PKCE, providers as data, argon2id local accounts, database-backed sessions and explicit identity linking — a plugin, because an application with no accounts should link none of it."

[dependencies]
# The arrow points plugin -> core, always. The core does not know this crate
# exists and nothing here is reachable from it.
brocanth.workspace = true

# --- crypto we do not write ------------------------------------------------
#
# `argon2` (RustCrypto): the reference Rust Argon2 implementation, used by the
# PHC string format's own reference crate, so a stored hash is a portable
# `$argon2id$...` string rather than a bespoke encoding. We take argon2id and
# offer no alternative.
argon2 = "0.6"
# `jsonwebtoken`: the maintained Rust JWT crate, and the only one that both
# verifies RS256/ES256 id_tokens and *signs* ES256, which Apple's client-secret
# JWT requires. `rust_crypto` keeps the backend pure Rust: no aws-lc-rs C build
# in a plugin an application may not even use.
jsonwebtoken = { version = "11", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# HMAC-SHA256 for the session cookie signature, for hashing the verifier half
# of a single-use token, and for the keyed network digest a login alert stores.
# RustCrypto again, same reason.
hmac = "0.13"
sha2 = "0.11"
# HMAC-SHA1, and only for TOTP. RFC 6238's interoperable parameters are SHA-1,
# six digits and thirty seconds, and an authenticator app that ignores the
# `algorithm` field of the `otpauth:` URI — most of them — will produce SHA-1
# codes whatever we ask for. HMAC needs its hash to be a PRF, not
# collision-resistant, so the attack on SHA-1 does not reach here. RustCrypto,
# so it shares `digest` with `sha2` and adds no second trait stack.
sha1 = "0.11"
# Constant-time equality. `==` on a byte slice short-circuits and leaks the
# length of the common prefix, which is enough to forge a MAC one byte at a
# time.
subtle = "2.6"
# The OS CSPRNG, directly. Session ids, state, nonce, PKCE verifiers and
# single-use tokens are all "give me N unpredictable bytes" and nothing else.
getrandom = "0.4"

# --- plumbing ---------------------------------------------------------------
base64 = "0.23"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# The storage trait and the HTTP client trait are both async and both
# object-safe, which `async fn` in a trait still is not.
async-trait = "0.1"

# `reqwest` is the default HTTP client because it is what the ecosystem
# already has in the tree, and rustls keeps it off the system TLS stack. It is
# a feature, and the trait is the contract: an application already holding a
# hyper or ureq client sets `default-features = false` and implements
# `HttpClient` itself, and reqwest then appears nowhere in its lock file.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
    "form",
], optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `auth`. It lives beside the crate it writes into a project, and not in the
# CLI, because what it must stay true to is this crate's own surface:
# `AuthConfig`'s fields are values the application built rather than text a
# TOML file can carry, `SigningKey::parse` refuses anything that is not 32
# bytes, and `MemoryStore` is still the only `AuthStore` there is. A copy of
# that knowledge in the CLI rots the first time a name here changes, and it
# rots in silence, because nothing compiles the generator against this crate.
#
# Optional, and off by default, because two different people read this
# dependency line. An application with accounts wants the accounts and nothing
# else. The one program that wants the generator is the CLI, which asks for
# `features = ["scaffold"]`. So the code that writes authentication into a new
# project is never linked into an application that merely has it.
brocanth-scaffold = { workspace = true, optional = true }

# `src/admin.rs` is the **Accounts** tab in the backoffice: every account, its
# address, whether that address is proven, whether it has a password, when it
# was made, and the sessions open on it.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and no password hasher, and intends to keep it that way. An
# accounts panel written there would put argon2 and a JWT library in the
# binary of every application that has a backoffice. The admin owns the seam
# and this crate owns the screens.
#
# Optional and off, so an application with accounts and no backoffice links
# neither the admin nor rsx.
brocanth-admin = { workspace = true, optional = true }

# The templates, compiled in by the macro. Only reachable through `admin`: a
# login does not render HTML.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

[dev-dependencies]
# The only thing the tests need that the library does not already provide: a
# runtime to drive the async store and HTTP traits.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# `trybuild`: the standard way to assert that something does **not** compile.
# The guarantee in `mfa` — that a sign-in which skipped the policy cannot be
# written — is a claim about programs that do not exist, and no ordinary test
# can make it. See `tests/compile_fail.rs`. The expected-output files are
# rustc's own diagnostics, so they are pinned to the toolchain in `mise.toml`;
# a toolchain bump regenerates them with `TRYBUILD=overwrite`.
trybuild = "1.0.122"

# This crate, as a dev-dependency on itself, with `admin` on, so the panel's
# tests render the real screens through the real `Admin` rather than asserting
# on a context struct. A screen that compiles and produces the wrong page is
# the failure worth catching. The ordinary dependency tree is unaffected: a
# published build links no admin and no rsx.
brocanth-auth = { path = ".", features = ["admin"] }

# The HTML assertions, and only those: `Html::assert_button` answers "is there
# a button that says End every session", where `body.contains(..)` answers
# "do those words appear anywhere, including in a comment". The test client
# itself needs a built `App` and this test drives `Admin::dispatch`, so only
# `Html` is used.
brocanth-test.workspace = true

[features]
# Empty by default, and that is the §8 rule rather than an oversight. The plan
# puts sessions, cookies and argon2id in v1 and cuts OAuth from it, so the
# common case here is an application with local accounts and no provider at
# all — and that application must not link an HTTP client, a TLS stack and an
# async runtime to hash a password. Turn the feature on to get
# `ReqwestClient`; leave it off and implement `HttpClient` over whatever the
# application already holds.
default = []
reqwest-client = ["dep:reqwest"]

# The scaffold module, for `brocanth create`. Off by default: see the
# dependency line above for why the generator is not an application's
# business.
scaffold = ["dep:brocanth-scaffold"]

# The backoffice tab. Off, like every other way out of this crate. `admin` off
# means the code is absent and not merely unreachable: `src/admin.rs` and the
# templates beside it are `#[cfg]`-ed out of the crate entirely.
admin = ["dep:brocanth-admin", "dep:rsx"]

[lints.rust]
missing_docs = "warn"
