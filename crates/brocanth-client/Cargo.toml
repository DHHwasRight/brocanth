[package]
name = "brocanth-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A command line that is a client for the application that generated it, built from the same table the document is."

[dependencies]
brocanth = { workspace = true, optional = true }
brocanth-input = { workspace = true, optional = true }
zod = { workspace = true, optional = true }

# Already the command crate's dependency and re-exported by it, so a
# project with both links one copy. `string` because a subcommand's name
# comes out of a table rather than out of a literal.
clap = { version = "4", features = ["derive", "string"], optional = true }

# The same choice `brocanth-auth` made, for the same reason: reqwest is
# what the ecosystem already has in the tree, rustls keeps it off the
# system TLS stack, and `Wire` is the contract -- an application holding
# its own client sets `default-features = false`, implements `Wire`, and
# reqwest appears nowhere in its lock file. `blocking` because a command
# line sends one request and exits, and starting a reactor to do that is
# a reactor nobody asked for.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "charset",
    "blocking",
], optional = true }

brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
# `tests/scaffold.rs`: the module, generated into a project by the CLI's
# own generator and checked with `brocanth_scaffold::testing`. A cycle
# through dev-dependencies, which cargo allows: the CLI takes this crate's
# `scaffold` side.
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-cli = { path = "../brocanth-cli" }

[features]
default = ["runtime", "reqwest-client"]
# The client and its command: everything but the scaffold module. The CLI
# turns it off and takes `scaffold` alone, so `brocanth create` links no HTTP
# client and no server to write a project that has both.
runtime = ["dep:brocanth", "dep:brocanth-input", "dep:zod", "dep:clap"]
# The shipped sender. Off, and this crate plans the request and hands it
# back for a caller that has its own way to send one.
reqwest-client = ["runtime", "dep:reqwest"]
scaffold = ["dep:brocanth-scaffold"]

[lints.rust]
missing_docs = "deny"
