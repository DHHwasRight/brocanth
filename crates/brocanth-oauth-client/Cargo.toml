[package]
name = "brocanth-oauth-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "OAuth 2.0 client for brocanth: connect a third-party account to a signed-in person, keep its tokens encrypted, refresh them once, and call the API with a bearer token. The `oauth2` crate, wrapped."

# What this crate is: golang.org/x/oauth2 for a brocanth application. It
# calls a third-party API on behalf of a person (a connected account) or of
# the application (client credentials). It is not a sign-in: that is
# `brocanth-auth` and its `auth-oauth` module.
#
# Everything the application runs is behind `runtime`, on by default. The
# CLI takes this crate with `default-features = false, features =
# ["scaffold"]`, so the generator links no TLS stack and no driver.
[dependencies]
brocanth = { workspace = true, optional = true }

# The protocol. `oauth2` 5 is the maintained Rust crate for what
# golang.org/x/oauth2 does: typed URLs, PKCE, the code exchange, refresh,
# client credentials and revocation. Its default features bring reqwest
# 0.12, and the workspace is on reqwest 0.13. So its features are off, and
# `src/http.rs` implements its `AsyncHttpClient` over the reqwest the
# workspace already links. No second reqwest major lands in the tree.
oauth2 = { version = "5", default-features = false, optional = true }
# The same choice and features `brocanth-auth` and `brocanth-webhooks` made:
# rustls, no system TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
], optional = true }
http = { version = "1", optional = true }
url = { version = "2", optional = true }

# The token encryption. XChaCha20-Poly1305: an AEAD with a 24-byte nonce,
# so a random nonce per seal is safe for as many tokens as a store holds.
# RustCrypto and pure Rust, like every other primitive in the workspace.
# 0.11, because it shares `crypto-common` 0.2 and `chacha20` 0.10 with the
# `hmac`, `sha2` and `rand` the workspace already links.
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
], optional = true }
# Key derivation (one key in, a state key and a token key out) and the
# constant-time state compare. The versions `brocanth-auth` takes.
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2.6", optional = true }
getrandom = { version = "0.4", optional = true }
base64 = { version = "0.23", optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
# The store is a trait object behind an `Arc`.
async-trait = { version = "0.1", optional = true }
# One refresh per key: an async mutex per (account, provider).
tokio = { version = "1", default-features = false, features = [
    "sync",
    "rt",
], optional = true }

# `postgres`: the tokens are rows in the database the `db` module opened.
brocanth-db = { workspace = true, optional = true }

# `admin`: the connections tab in `brocanth-admin`.
brocanth-admin = { workspace = true, optional = true }

# `scaffold`: the modules `brocanth create` offers as `oauth-client` and
# `oauth-client-memory`.
brocanth-scaffold = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# This crate with every feature on, so `cargo test -p brocanth-oauth-client`
# runs the Postgres, panel and conformance tests.
brocanth-oauth-client = { path = ".", features = ["postgres", "admin", "conformance", "scaffold"] }
brocanth-cli = { path = "../brocanth-cli" }
brocanth-scaffold = { workspace = true, features = ["testing"] }
# The panel test builds a `PanelRequest`; the Postgres test opens a pool on
# its own schema.
brocanth-admin.workspace = true
brocanth-db.workspace = true
# The fake provider checks the PKCE verifier and reads forms.
sha2 = "0.11"
base64 = "0.23"
url = "2"

[features]
default = ["runtime"]
runtime = [
    "dep:brocanth",
    "dep:oauth2",
    "dep:reqwest",
    "dep:http",
    "dep:url",
    "dep:chacha20poly1305",
    "dep:hmac",
    "dep:sha2",
    "dep:subtle",
    "dep:getrandom",
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:async-trait",
    "dep:tokio",
]
# `PgTokenStore`: the tokens in Postgres.
postgres = ["runtime", "dep:brocanth-db"]
# The connections tab.
admin = ["runtime", "dep:brocanth-admin"]
# The store contract as one async function, for a store author's tests.
conformance = ["runtime"]
scaffold = ["dep:brocanth-scaffold"]

[lints.rust]
missing_docs = "warn"
