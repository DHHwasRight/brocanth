[package]
name = "brocanth-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The brocanth model layer: validations, correct eager loading, hook-safe bulk writes, N+1 detection and dirty tracking over SeaORM."

[dependencies]
brocanth-model-derive = { path = "derive", version = "=0.1.0" }

# Pinned exactly. SeaORM 2.0 is three months old; a patch bump is a decision,
# not a side effect.
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "entity-registry",
    "sqlite-use-returning-for-3_35",
] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "with-chrono",
    "entity-registry",
] }

async-trait = "0.1"
inventory = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
missing_docs = "warn"
