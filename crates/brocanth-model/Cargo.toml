[package]
name = "brocanth-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The brocanth model layer: validations, correct eager loading, hook-safe bulk writes, N+1 detection and dirty tracking over SeaORM."
readme = "README.md"

[dependencies]
brocanth-model-derive = { path = "derive", version = "=0.1.0" }

# The publishing seam, and the whole of what this crate knows about who reads
# a write (PLAN.md §10). It has no dependencies of its own, so the arrow costs
# an application that publishes to nobody one `wants` call returning false.
brocanth-events = { workspace = true }

# Only for `src/plugin.rs`, which is the ORM's end of `brocanth::plugin_model`.
# Optional, and off, because a model layer is useful without a router: an
# application that writes rows from a job runner or a command should not link
# the core to do it. The core never names this crate, so the arrow points one
# way whether the feature is on or off.
brocanth = { workspace = true, optional = true }

# Only for `src/orm.rs`: `Orm`, SeaORM over the pool `brocanth-db` opened
# (ADR 2: the ORM is registered after the pool, because it needs it).
# Optional, and off: a model layer that opens its own connection does not
# link a second database crate. Both crates resolve to the one sqlx 0.9 in
# the lock file, so the pool type is the same type on both sides.
brocanth-db = { workspace = true, optional = true }

# Pinned exactly. SeaORM 2.0 is three months old; a patch bump is a decision,
# not a side effect.
#
# The driver is not listed here. It arrives through the `postgres` feature
# below.
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "entity-registry",
] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "with-chrono",
    "entity-registry",
] }

async-trait = "0.1"
inventory = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
# Only for `testing::Harness`, whose drop runs its cleanup on a runtime of its
# own. SeaORM already links tokio, so this adds no crate.
tokio = { version = "1", features = ["rt"] }

[features]
# The ORM's end of the core's model seam: `brocanth_model::plugin`. See the
# dependency line above for why it is off.
plugin = ["dep:brocanth"]

# `Orm`, built from a `brocanth_db::Db`. Postgres, because that is the only
# pool `brocanth-db` opens.
db = ["dep:brocanth-db", "postgres"]

# Postgres is the base. brocanth stores queues, cache and blobs in the same
# database as the models, and every one of those is better on Postgres: a real
# `BOOLEAN`, `JSONB`, arrays, partial and expression indexes, transactional
# DDL, `FOR UPDATE SKIP LOCKED` for the queue and `LISTEN/NOTIFY` for
# multi-process realtime. The model layer is the thing that must not be
# designed around anything else.
#
# Postgres only (2026-11-11): RLS and one database keep the framework simple.
# The feature stays, on by default, so that crates which name it keep
# building. A build without it does not compile.
default = ["postgres"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# This crate, as a dev-dependency on itself, with `plugin` and `db` on, so the
# seam and its cost argument are compiled and tested on every run while
# staying out of a library build.
#
# The database tests need a server. They skip loudly unless
# `BROCANTH_MODEL_TEST_POSTGRES` or `BROCANTH_TEST_DATABASE_URL` names one.
brocanth-model = { path = ".", default-features = false, features = [
    "postgres",
    "plugin",
    "db",
] }

# The subscriber half, for `tests/changes.rs` only: the proof that a row
# written through the ORM reaches a realtime subscriber is worth more than two
# tests that each stop at the seam. A dev-dependency reaches no application,
# and the arrow a library build draws is still only to `brocanth-events`.
brocanth-realtime = { workspace = true }

[lints.rust]
missing_docs = "warn"
