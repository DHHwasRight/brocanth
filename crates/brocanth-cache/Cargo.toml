[package]
name = "brocanth-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A cache for brocanth, kept in Postgres, so a small deployment has one moving part instead of two."

# The arrow points from the plugin to the core, never back. An application that
# does not write `CachePlugin` in its `main` links none of this.
[dependencies]
brocanth.workspace = true

# The seam is an async trait held behind `Arc<dyn Cache>`, and `async fn` in a
# trait is still not object-safe. Same choice, for the same reason, as
# `brocanth-auth`'s `AuthStore` and `brocanth-storage`'s `Storage`.
async-trait = "0.1"
thiserror = "2"

# Time is a value this crate holds rather than a function it calls; see
# `src/clock.rs`. `chrono` with `default-features = false` is the same spelling
# `brocanth-jobs` uses, so an application running both links one copy.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

# `fetch` waits for whoever holds the lease, and waiting needs a timer. This is
# the one runtime dependency that is not behind a backend feature, and it is
# deliberate: `fetch` is the operation people actually call, a caller already
# holds an async cache by the time it calls one, and a cache crate that cannot
# wait cannot answer the stampede question at all.
#
# `rt` is here only so `CachePlugin` can reach a runtime handle in
# `before_start`, where the core's lifecycle hook is synchronous and `migrate`
# is not — the same manoeuvre `brocanth-jobs` makes. This crate spawns nothing
# and starts no runtime of its own.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

# `sqlx` is version 0.9, which is the version `sea-orm` 2.0.4 already resolves
# to in this workspace and the version `brocanth-jobs` pins. An application
# running the models, the queue and the cache links one SQL driver and one
# connection pool implementation, not three.
#
# Optional, because of the feature argument below.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
# `postgres` is the default and the only backend here. SQLite is the "smaller
# setups, different crate" case, and this crate is shaped so that crate can
# exist: build this one with `default-features = false` and you get the trait,
# the key types, the error type, the clock and `fetch` — and no `sqlx`, no
# driver, no pool. A SQLite backend is then a crate that depends on this one and
# implements `Cache`, exactly as an S3 backend is for `brocanth-storage`.
#
# So, unlike `brocanth-jobs`, there is no `compile_error!` when every backend
# feature is off, because a backend-free build of this crate is a legitimate
# thing to want rather than a mistake. What a `compile_error!` buys there — you
# find out at build time instead of at run time — is bought here by the type
# system instead: with `postgres` off, `PgCache` does not exist, and a program
# that names it fails to compile with a message pointing at the name.
default = ["postgres"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-ring"]

[lints.rust]
missing_docs = "warn"
