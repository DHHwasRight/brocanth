[package]
name = "brocanth-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The job contract: two lanes, a lease, and a backend trait specified against the weakest backend it intends to support."

# The core names no driver and no backend. It depends on serde because a
# payload crosses a process boundary, and on tokio because a worker owns
# tasks, timers and a semaphore. Nothing here knows what Postgres is.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints.rust]
missing_docs = "warn"
