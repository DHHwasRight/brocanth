[package]
name = "brocanth-rls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Postgres row-level security declared in Rust: roles, functions, grants and policies, ordered by their dependencies, diffed against a snapshot into a migration."
readme = "README.md"

[dependencies]
# The pool, the transaction and `Principal`, and the sea-query this crate
# builds expressions with. Through `brocanth-db`, so there is one sea-query
# in the tree and the expression type is the one a page already uses.
brocanth-db = { workspace = true, optional = true }
# `migrations/rls.json`, the snapshot the diff reads.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
# `Policy::from_rules` and `SqlExpr::from_rule` read a policy's `Rules` and
# its subject's `Attr`s (docs/policy-rls-bridge.md §3), and
# `identity(&role, &subject)` sets the subject's attributes as a request's
# settings (decision 6). Under `runtime` only: the CLI builds `scaffold`
# alone and links no policy algebra.
brocanth-policy = { workspace = true, optional = true }
# `agreement`: the test of docs/policy-rls-bridge.md decision 10. It draws
# rows with the generator of `brocanth_policy::agreement` (proptest), and
# runs its own runtime, so a plain `#[test]` can call it. Optional and off:
# an application turns it on for its tests only.
proptest = { version = "1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `rls`. Optional and off: only the CLI asks for `features = ["scaffold"]`.
brocanth-scaffold = { workspace = true, optional = true }

# `tests/scaffold.rs`: the module, generated into a project by the CLI's own
# generator. A cycle through dev-dependencies, which cargo allows.
[dev-dependencies]
brocanth-rls = { path = ".", features = ["scaffold", "agreement"] }
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-cli = { path = "../brocanth-cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# tests/seaorm.rs compiles the SeaORM migration `rls make` writes in a
# project with `model`. Postgres, the model layer's default.
brocanth-model = { path = "../brocanth-model", features = ["db"] }
async-trait = "0.1"
# tests/rules.rs and tests/bridge_postgres.rs: an entity and a subject from
# `policy!` and `#[derive(Subject)]`, with hand-written `Rules`.
# tests/identity.rs: a subject with every attribute kind, so `uuid` and
# `chrono` too.
brocanth-policy = { workspace = true, features = ["macro", "uuid", "chrono"] }
uuid = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false }

[features]
default = ["runtime"]
# Everything an application runs. The CLI turns it off and takes `scaffold`
# alone, so `brocanth create` links no driver to write a project that has one.
runtime = ["dep:brocanth-db", "dep:brocanth-policy", "dep:serde", "dep:serde_json", "dep:thiserror"]
scaffold = ["dep:brocanth-scaffold"]
# The agreement harness: `agreement::check` and what the `db { … }` clause
# of `policy!` calls. For an application's dev-dependencies.
agreement = ["runtime", "brocanth-policy/agreement-proptest", "dep:proptest", "dep:tokio"]

[lints.rust]
missing_docs = "warn"
