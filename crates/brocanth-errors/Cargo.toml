[package]
name = "brocanth-errors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "HTML error pages and error reporters: the plain and development pages, and the hook a reporter implements."

# Two dependencies with `runtime` (on by default), both already in every
# application: the core and `http`. The pages are string building; no
# template engine.
#
# Both are optional. The CLI depends on this crate with
# `default-features = false, features = ["scaffold"]`, so writing a project
# does not link the runtime the project will run.
[dependencies]
brocanth = { workspace = true, optional = true }
http = { version = "1", optional = true }

# `config`: `ErrorsConfig` deserialises, so an `[errors]` section of a
# brocanth-config file builds one.
serde = { version = "1", features = ["derive"], optional = true }

[dependencies.brocanth-scaffold]
workspace = true
optional = true

[dev-dependencies]
brocanth-errors = { path = ".", features = ["config"] }
# `tests/scaffold.rs`: the module, generated by the CLI's own generator and
# checked with `brocanth_scaffold::testing`. A cycle through
# dev-dependencies, which cargo allows.
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-cli = { path = "../brocanth-cli" }

[features]
default = ["runtime"]
# The plugin, the pages and the reporter contract: what an application links.
runtime = ["dep:brocanth", "dep:http"]
# The `errors` module `brocanth create` and `brocanth add` offer.
scaffold = ["dep:brocanth-scaffold"]
config = ["runtime", "dep:serde"]
