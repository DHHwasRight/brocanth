[package]
name = "brocanth-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Background jobs for brocanth: a database-backed queue with retries, a dead letter, scheduling and a worker pool — a plugin, because an application that enqueues nothing should pay nothing."

# The core has three dependencies and a test that fails the build if a fourth
# kind arrives. This crate is where the async runtime and the SQL driver
# actually land, and that is the point: the arrow points from the plugin to the
# core, never back. An application that never writes `JobsPlugin` in its `main`
# links none of this.
#
# `sqlx` is version 0.9, which is the version `sea-orm` 2.0.4 already resolves
# to in this workspace, so an application running both the model layer and the
# queue links one SQL driver and one connection pool implementation, not two.
[dependencies]
brocanth.workspace = true

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `jobs`. It lives beside the crate it writes into a project, and not in the
# CLI, because everything it writes is a statement about this crate: that
# `Queue::connect` is async while `Plugin::new` is not, that a worker needs a
# registry of job types the project owns, that `JobsConfig` holds a live
# `Queue` and therefore cannot come out of a TOML file. A copy of that in the
# CLI rots the first time a name here changes, and it rots in silence.
#
# Optional and off, because two different people read this dependency line.
# An application that runs jobs wants the queue and nothing else. The one
# program that wants the generator is the CLI, which asks for
# `features = ["scaffold"]`.
brocanth-scaffold = { workspace = true, optional = true }

# `src/admin.rs` is the queue's tab in the backoffice: a dashboard, what is
# running, the retry set, the scheduled set and the dead letter.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and no SQL driver, and intends to keep it that way. A jobs
# panel written there would put the queue in the binary of every
# application that has a backoffice. The admin owns the seam and this crate
# owns the screens.
#
# Optional and off, so a worker process links neither the admin nor rsx.
brocanth-admin = { workspace = true, optional = true }

# The templates, compiled in by the macro. Only reachable through `admin`:
# a queue does not render HTML.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

# The panel's trait is async and object-safe, which `async fn` in a trait
# still is not. Same spelling the admin uses, so one copy is linked.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

# No backend feature here on purpose. It is the same `sqlx` the library
# depends on, so whichever driver the build already has is the driver the
# tests get. `tests/postgres.rs` uses it to build the throwaway schema the
# migration-race test needs, which `Queue` has no reason to expose.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }

# This crate, as a dev-dependency on itself, with SQLite on. It is the answer
# to the question the default change raises: `cargo test -p brocanth-jobs` on a
# laptop with no server running still has to run the suite.
#
# The dev-dependency adds `sqlite` to whatever the test build already has, so
# the file-backed harness is always there for tests, examples and benches, and
# never for a library build. The ordinary dependency tree is unaffected: a
# published build of this crate links the Postgres driver and nothing else.
# `admin` as well, so the panel's tests render the real screens through the
# real admin rather than asserting on a context struct. A screen that
# compiles and produces the wrong page is the failure worth catching.
brocanth-jobs = { path = ".", default-features = false, features = ["sqlite", "admin"] }

[features]
# The backend is a compile-time choice made in `Cargo.toml`, which is the whole
# answer to the Rails trap: Rails configures Solid Queue in `production.rb`
# only, so development and test run a different queue and a job that works
# locally fails in production. A Cargo feature cannot vary by `RAILS_ENV`. The
# queue you build is the queue you run, in every environment. That reasoning is
# unchanged and is the reason this is a feature at all.
#
# What changed is which one is the default.
#
# `postgres` is the default, because Postgres is brocanth's base. The same
# database holds the models, the cache and the blobs, and the queue's central
# mechanism — `FOR UPDATE SKIP LOCKED` — is a Postgres mechanism that SQLite
# answers with a whole-file write lock and serialised claims. Shipping a queue
# whose default is the backend that cannot do the thing the queue is for was
# the wrong way round.
#
# The cost is real and is stated rather than hidden. The previous default was
# argued for on the grounds that the framework's own tests, a `cargo test` on a
# laptop and a small single-machine deployment all want a backend that needs no
# server. The last of those is still true, and `sqlite` is still supported for
# exactly it. The first two are now paid for by `[dev-dependencies]`, where
# this crate depends on itself with `sqlite` on, so `cargo test` keeps running
# the whole suite with no server while a library build gets one driver.
#
# What is left unpaid: the default-built code path is now the one that a laptop
# with no Postgres does not exercise. `tests/postgres.rs` closes that gap only
# when `BROCANTH_JOBS_TEST_POSTGRES` or `BROCANTH_TEST_DATABASE_URL` names a
# server, and it says loudly when it was skipped.
#
# A single-machine deployment writes:
#
# ```toml
# brocanth-jobs = { version = "0.1", default-features = false, features = ["sqlite"] }
# ```
#
# and gets no Postgres driver. Leaving `default-features` on and adding
# `sqlite` compiles both drivers, which works and is almost never what you
# meant.
default = ["postgres"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring"]
sqlite = ["sqlx/sqlite-bundled"]

# The scaffold module, for `brocanth create`. Off by default, for the reason
# in the dependency comment: writing a queue into a new project is the CLI's
# business and not an application's.
scaffold = ["dep:brocanth-scaffold"]

# The backoffice tab. Off, like every other way out of this crate.
admin = ["dep:brocanth-admin", "dep:rsx", "dep:async-trait"]

[lints.rust]
missing_docs = "warn"
