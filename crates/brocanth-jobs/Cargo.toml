[package]
name = "brocanth-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Background jobs for brocanth: typed jobs, cron schedules, events and an admin panel over the brocanth-queue engine — a plugin, because an application that enqueues nothing should pay nothing."

# The core has three dependencies and a test that fails the build if a fourth
# kind arrives. This crate is where the async runtime and the SQL driver
# actually land, and that is the point: the arrow points from the plugin to the
# core, never back. An application that never writes `JobsPlugin` in its `main`
# links none of this.
#
# `sqlx` is version 0.9, which is the version `sea-orm` 2.0.4 already resolves
# to in this workspace, so an application running both the model layer and the
# queue links one SQL driver and one connection pool implementation, not two.
[dependencies]
brocanth = { workspace = true, optional = true }

# The engine. Its worker claims, leases, retries and buries the jobs; this
# crate adds typed jobs, cron, events and the admin panel on top
# (`brocanth-queue/docs/DECISIONS.md`, Part 6). It costs nothing in the
# tree: the contract names serde, serde_json, thiserror and tokio, which is
# the set below already.
brocanth-queue = { workspace = true, optional = true }

# The engine's backends, which hold the jobs. A feature below chooses.
brocanth-queue-postgres = { workspace = true, optional = true }
brocanth-queue-memory = { workspace = true, optional = true }

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `jobs`. It lives beside the crate it writes into a project, and not in the
# CLI, because everything it writes is a statement about this crate: that
# `Queue::connect` is async while `Plugin::new` is not, that a worker needs a
# registry of job types the project owns, that `JobsConfig` holds a live
# `Queue` and therefore cannot come out of a TOML file. A copy of that in the
# CLI rots the first time a name here changes, and it rots in silence.
#
# Optional and off, because two different people read this dependency line.
# An application that runs jobs wants the queue and nothing else. The one
# program that wants the generator is the CLI, which asks for
# `features = ["scaffold"]`.
brocanth-scaffold = { workspace = true, optional = true }

# `src/admin.rs` is the queue's tab in the backoffice: a dashboard, what is
# running, the retry set, the scheduled set and the dead letter.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and no SQL driver, and intends to keep it that way. A jobs
# panel written there would put the queue in the binary of every
# application that has a backoffice. The admin owns the seam and this crate
# owns the screens.
#
# Optional and off, so a worker process links neither the admin nor rsx.
brocanth-admin = { workspace = true, optional = true }

# The templates, compiled in by the macro. Only reachable through `admin`:
# a queue does not render HTML.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

# dp-swap's mutating verbs, which the row buttons use so a retry removes
# the row and does not reload the page. Only the script is read from it.
# Two dependencies, both already in this tree.
brocanth-middleware = { workspace = true, optional = true }

# The panel's trait is async and object-safe, which `async fn` in a trait
# still is not. Same spelling the admin uses, so one copy is linked.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
# The generator and its checks, for tests/scaffold.rs. A cycle through
# dev-dependencies, which cargo allows: the CLI takes this crate's
# `scaffold` side.
brocanth-scaffold = { workspace = true, features = ["testing"] }
brocanth-cli = { path = "../brocanth-cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

# The engine's backends, so `tests/panel.rs` can render the screens over
# them directly, and the history screen over the one with an archive.
brocanth-queue-memory.workspace = true
brocanth-queue-postgres.workspace = true

# The same `sqlx` the library depends on, for the throwaway schema and the
# transactions the Postgres tests open.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }

# This crate, as a dev-dependency on itself, with `memory` and `admin` on:
# `cargo test -p brocanth-jobs` on a laptop with no server runs the whole
# suite on the memory backend, and the panel tests render the real screens.
# A library build gets neither.
brocanth-jobs = { path = ".", default-features = false, features = ["postgres", "memory", "admin", "scaffold"] }

[features]
# The backend is a compile-time choice made in `Cargo.toml`, which is the whole
# answer to the Rails trap: Rails configures Solid Queue in `production.rb`
# only, so development and test run a different queue and a job that works
# locally fails in production. A Cargo feature cannot vary by `RAILS_ENV`.
#
# `postgres` is the default, because Postgres is brocanth's base and the
# engine's claim is `FOR UPDATE SKIP LOCKED`.
#
# `memory` is the engine's memory backend, for tests and development only:
# the jobs live in the process and are gone when it stops. It passes the
# same conformance suite as Postgres. `brocanth check --deploy` reports a
# project that ships it.
#
# The `sqlite` feature is gone: it was a second job system, and the engine
# has no SQLite adapter yet (`brocanth-queue/docs/DECISIONS.md` §6.4).
default = ["runtime", "postgres"]
postgres = [
    "runtime",
    "sqlx/postgres",
    "sqlx/tls-rustls-ring",
    "dep:brocanth-queue-postgres",
]
memory = ["runtime", "dep:brocanth-queue-memory"]

# The queue itself: everything but the scaffold module. Each backend turns it
# on. The CLI turns every default off and takes `scaffold` alone, so
# `brocanth create` links no driver and no tokio to write a queue into a
# project.
runtime = [
    "dep:brocanth",
    "dep:brocanth-queue",
    "dep:sqlx",
    "dep:tokio",
    "dep:chrono",
    "dep:serde",
    "dep:serde_json",
]

# The scaffold module, for `brocanth create`. Off by default, for the reason
# in the dependency comment: writing a queue into a new project is the CLI's
# business and not an application's.
scaffold = ["dep:brocanth-scaffold"]

# The backoffice tab. Off, like every other way out of this crate.
admin = [
    "runtime",
    "dep:brocanth-admin",
    "dep:rsx",
    "dep:async-trait",
    "dep:brocanth-middleware",
]

[lints.rust]
missing_docs = "warn"
