[package]
name = "brocanth-openapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An OpenAPI 3.1 document derived from a brocanth route table, plus a drift check that turns `the spec is out of date` into a build failure."

# Three dependencies, and two of them are the core's own. There is no serde
# here and no YAML crate: the document is built as an ordered value and
# written by hand, so key order is ours to fix and a drift diff compares
# structure rather than whitespace. An application that does not name this
# plugin in `main` links none of it.
[dependencies]
brocanth.workspace = true
http = "1"
thiserror = "2"

# `src/scaffold.rs` is the module `brocanth create` offers under the key
# `openapi`. It lives beside the crate it writes into a project, and not in
# the CLI, because everything it writes is a statement about this crate: that
# `SpecBuilder` takes a `Router` and gives a `Document`, that `OpenApiConfig`
# holds a whole document and so cannot come out of a TOML file, that
# `OpenApiPlugin::configure` is where an invalid document becomes a build
# failure. A copy of that in the CLI rots the first time a name here changes,
# and it rots in silence, because nothing compiles the generator against this
# crate.
#
# Optional, and off by default, because two different people read this
# dependency line. An application that publishes a document wants the document
# and nothing else. The one program that wants the generator is the CLI, which
# asks for `features = ["scaffold"]`.
brocanth-scaffold = { workspace = true, optional = true }

# `src/admin.rs` is the document's tab in the backoffice: every operation
# with its path, verb and summary, and one screen per operation for its
# parameters, body and responses. PocketBase's API preview, generated from
# the route table instead of from a collection editor.
#
# It is here and not in `brocanth-admin` because that crate has four
# dependencies and intends to keep them. An API tab written there would
# put the document builder in the binary of every application with a
# backoffice. The admin owns the seam and this crate owns the screens.
#
# Optional and off, so a program that only serves `/openapi.json` links
# neither the admin nor a template engine.
brocanth-admin = { workspace = true, optional = true }

# The screens, compiled in by the macro. Only reachable through `admin`: a
# document does not render HTML. Same spelling the admin uses, so one copy
# is linked.
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0", optional = true }

# The second schema source. `src/adapter.rs` mirrors `brocanth-schema`'s
# node type and explains why; this one does not need a mirror, because a
# `zod::Node` carries the name of the struct it came from and so can
# register its own components. Optional and off: a document hand-written
# with `Schema::object()` needs neither source.
zod = { workspace = true, optional = true }

# The panel's trait is async and object-safe, which `async fn` in a trait
# still is not. Same spelling the admin uses, so one copy is linked.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
# The HTTP test client. `tests/panel.rs` uses `Html` alone: it drives the
# real `Admin` directly, because this crate mounts no routes of the
# admin's. Asserting on a substring of the page is the habit it exists to
# end (`docs/framework-gaps.md` §G6).
brocanth-test.workspace = true

[features]
default = []

# The scaffold module, for `brocanth create`. Off by default: see the
# dependency line above for why the generator is not an application's
# business.
scaffold = ["dep:brocanth-scaffold"]

# The backoffice tab. Off, like every other way out of this crate.
admin = ["dep:brocanth-admin", "dep:rsx", "dep:async-trait"]

# Read a schema out of a `zod::Node`, so a struct that derives
# `zod::Entry` describes its own request and response bodies.
zod = ["dep:zod"]
