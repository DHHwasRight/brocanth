[workspace]
resolver = "2"
members = [
    "crates/brocanth",
    "crates/brocanth-admin",
    "crates/brocanth-admin-model",
    "crates/brocanth-gtag",
    "crates/brocanth-analytics",
    "crates/brocanth-audit",
    "crates/brocanth-flags",
    "crates/brocanth-assets",
    "crates/brocanth-bundle",
    "crates/brocanth-auth",
    "crates/brocanth-cache",
    "crates/brocanth-cache-conformance",
    "crates/brocanth-cache-redis",
    "crates/brocanth-cli",
    "crates/brocanth-config",
    "crates/brocanth-db",
    "crates/brocanth-events",
    "crates/brocanth-i18n",
    "crates/brocanth-client",
    "crates/brocanth-input",
    "crates/brocanth-jobs",
    "crates/brocanth-mail",
    "crates/brocanth-middleware",
    "crates/brocanth-migrate",
    "crates/brocanth-model",
    "crates/brocanth-observe",
    "crates/brocanth-openapi",
    "crates/brocanth-robots",
    "crates/brocanth-sanitize",
    "crates/brocanth-pagination",
    "crates/brocanth-filters",
    "crates/brocanth-search",
    "crates/brocanth-errors",
    "crates/brocanth-meta",
    "crates/brocanth-policy",
    "crates/brocanth-policy-macros",
    "crates/brocanth-realtime",
    "crates/brocanth-resource",
    "crates/brocanth-schema",
    "crates/brocanth-server",
    "crates/brocanth-static",
    "crates/brocanth-storage",
    "crates/brocanth-webhooks",
    "crates/brocanth-oauth-client",
    "crates/brocanth-test",
    "crates/brocanth-pages",
    "crates/brocanth-queue",
    "crates/brocanth-queue-memory",
    "crates/brocanth-queue-conformance",
    "crates/brocanth-queue-postgres",
    "crates/brocanth-routes",
    "crates/brocanth-scaffold",
    "crates/brocanth-command",
    "crates/brocanth-command-macros",
    "examples/demo-app",
    "examples/nested-cards",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
brocanth = { path = "crates/brocanth", version = "0.1.0" }
brocanth-server = { path = "crates/brocanth-server", version = "0.1.0" }
brocanth-static = { path = "crates/brocanth-static", version = "0.1.0" }
brocanth-command = { path = "crates/brocanth-command", version = "0.1.0" }
brocanth-cache = { path = "crates/brocanth-cache", version = "0.1.0" }
brocanth-events = { path = "crates/brocanth-events", version = "0.1.0" }
brocanth-i18n = { path = "crates/brocanth-i18n", version = "0.1.0", default-features = false }
brocanth-admin = { path = "crates/brocanth-admin", version = "0.1.0" }
brocanth-analytics = { path = "crates/brocanth-analytics", version = "0.1.0", default-features = false }
brocanth-audit = { path = "crates/brocanth-audit", version = "0.1.0", default-features = false }
brocanth-flags = { path = "crates/brocanth-flags", version = "0.1.0", default-features = false }
brocanth-auth = { path = "crates/brocanth-auth", version = "0.1.0" }
brocanth-config = { path = "crates/brocanth-config", version = "0.1.0" }
brocanth-db = { path = "crates/brocanth-db", version = "0.1.0" }
brocanth-openapi = { path = "crates/brocanth-openapi", version = "0.1.0" }
brocanth-robots = { path = "crates/brocanth-robots", version = "0.1.0" }
brocanth-sanitize = { path = "crates/brocanth-sanitize", version = "0.1.0" }
brocanth-pagination = { path = "crates/brocanth-pagination", version = "0.1.0", default-features = false }
brocanth-filters = { path = "crates/brocanth-filters", version = "0.1.0", default-features = false }
brocanth-search = { path = "crates/brocanth-search", version = "0.1.0", default-features = false }
brocanth-errors = { path = "crates/brocanth-errors", version = "0.1.0", default-features = false }
brocanth-meta = { path = "crates/brocanth-meta", version = "0.1.0", default-features = false }
brocanth-schema = { path = "crates/brocanth-schema", version = "0.1.0", default-features = false }
brocanth-model = { path = "crates/brocanth-model", version = "0.1.0" }
brocanth-observe = { path = "crates/brocanth-observe", version = "0.1.0", default-features = false }
brocanth-admin-model = { path = "crates/brocanth-admin-model", version = "0.1.0" }
brocanth-jobs = { path = "crates/brocanth-jobs", version = "0.1.0" }
brocanth-policy = { path = "crates/brocanth-policy", version = "0.1.0" }
brocanth-policy-macros = { path = "crates/brocanth-policy-macros", version = "0.1.0" }

# The job contract and its backends. Four crates rather than one because
# the contract names no driver: `brocanth-queue` depends on serde and
# tokio and nothing else, which is why `brocanth-jobs` can take it for the
# admin screens without gaining a single transitive dependency.
brocanth-queue = { path = "crates/brocanth-queue", version = "0.1.0" }
brocanth-queue-memory = { path = "crates/brocanth-queue-memory", version = "0.1.0" }
brocanth-queue-postgres = { path = "crates/brocanth-queue-postgres", version = "0.1.0" }
brocanth-queue-conformance = { path = "crates/brocanth-queue-conformance", version = "0.1.0" }
brocanth-storage = { path = "crates/brocanth-storage", version = "0.1.0" }
brocanth-webhooks = { path = "crates/brocanth-webhooks", version = "0.1.0" }
brocanth-oauth-client = { path = "crates/brocanth-oauth-client", version = "0.1.0" }
brocanth-resource = { path = "crates/brocanth-resource", version = "0.1.0", default-features = false }
brocanth-realtime = { path = "crates/brocanth-realtime", version = "0.1.0" }
brocanth-assets = { path = "crates/brocanth-assets", version = "0.1.0" }
brocanth-pages = { path = "crates/brocanth-pages", version = "0.1.0" }
brocanth-scaffold = { path = "crates/brocanth-scaffold", version = "0.1.0" }
brocanth-test = { path = "crates/brocanth-test", version = "0.1.0" }
brocanth-mail = { path = "crates/brocanth-mail", version = "0.1.0" }
brocanth-middleware = { path = "crates/brocanth-middleware", version = "0.1.0" }
brocanth-gtag = { path = "crates/brocanth-gtag", version = "0.1.0" }
brocanth-migrate = { path = "crates/brocanth-migrate", version = "0.1.0" }
brocanth-input = { path = "crates/brocanth-input", version = "0.1.0" }
brocanth-client = { path = "crates/brocanth-client", version = "0.1.0" }

# The schema vocabulary the entrance reads input with. Its own repository,
# like rsx: it is a Rust library about rules and literals, and nothing in it
# knows what HTTP is.
zod = { path = "../zod", version = "0.1.0" }

# The build `cargo install --path crates/brocanth-cli --profile dist` uses
# for the installed CLI: no debug info, no symbols, thin LTO, one codegen
# unit. About 2.6 MB against 3.7 MB for plain `release`.
#
# A named profile and not `[profile.release]`: a profile in the workspace
# root applies to every member, and an application built here in release
# keeps its symbols, so a panic in production names the function. Cargo has
# no per-package `lto` or `strip`, so the CLI cannot have them alone.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
