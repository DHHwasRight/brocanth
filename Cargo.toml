[workspace]
resolver = "2"
members = [
    "crates/brocanth",
    "crates/brocanth-admin",
    "crates/brocanth-admin-model",
    "crates/brocanth-assets",
    "crates/brocanth-auth",
    "crates/brocanth-cache",
    "crates/brocanth-cli",
    "crates/brocanth-config",
    "crates/brocanth-events",
    "crates/brocanth-jobs",
    "crates/brocanth-middleware",
    "crates/brocanth-model",
    "crates/brocanth-openapi",
    "crates/brocanth-policy",
    "crates/brocanth-realtime",
    "crates/brocanth-resource",
    "crates/brocanth-schema",
    "crates/brocanth-server",
    "crates/brocanth-storage",
    "crates/brocanth-test",
    "crates/brocanth-pages",
    "crates/brocanth-scaffold",
    "crates/brocanth-command",
    "crates/brocanth-command-macros",
    "examples/demo-app",
    "examples/nested-cards",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
brocanth = { path = "crates/brocanth", version = "0.1.0" }
brocanth-server = { path = "crates/brocanth-server", version = "0.1.0" }
brocanth-command = { path = "crates/brocanth-command", version = "0.1.0" }
brocanth-cache = { path = "crates/brocanth-cache", version = "0.1.0" }
brocanth-events = { path = "crates/brocanth-events", version = "0.1.0" }
brocanth-admin = { path = "crates/brocanth-admin", version = "0.1.0" }
brocanth-auth = { path = "crates/brocanth-auth", version = "0.1.0" }
brocanth-config = { path = "crates/brocanth-config", version = "0.1.0" }
brocanth-openapi = { path = "crates/brocanth-openapi", version = "0.1.0" }
brocanth-schema = { path = "crates/brocanth-schema", version = "0.1.0", default-features = false }
brocanth-model = { path = "crates/brocanth-model", version = "0.1.0" }
brocanth-admin-model = { path = "crates/brocanth-admin-model", version = "0.1.0" }
brocanth-jobs = { path = "crates/brocanth-jobs", version = "0.1.0" }
brocanth-policy = { path = "crates/brocanth-policy", version = "0.1.0" }
brocanth-storage = { path = "crates/brocanth-storage", version = "0.1.0" }
brocanth-resource = { path = "crates/brocanth-resource", version = "0.1.0", default-features = false }
brocanth-realtime = { path = "crates/brocanth-realtime", version = "0.1.0" }
brocanth-assets = { path = "crates/brocanth-assets", version = "0.1.0" }
brocanth-pages = { path = "crates/brocanth-pages", version = "0.1.0" }
brocanth-scaffold = { path = "crates/brocanth-scaffold", version = "0.1.0" }
brocanth-test = { path = "crates/brocanth-test", version = "0.1.0" }
brocanth-middleware = { path = "crates/brocanth-middleware", version = "0.1.0" }
