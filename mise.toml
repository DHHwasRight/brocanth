[tools]
# Matches the depoth ecosystem: rsx's proc-macro artifacts are not compatible
# across patch releases.
rust = "1.98"

[tasks.build]
run = "cargo build --workspace"
[tasks.test]
run = "cargo test --workspace"
[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"
# Every module crate as the CLI takes it: the scaffold side alone, with the
# runtime off. Its own tests run too; doctests are the runtime's and stay in
# `test`.
[tasks.scaffold]
run = """
for c in admin auth cache client db gtag i18n input jobs mail middleware observe openapi policy realtime resource robots schema storage; do
  cargo test -p brocanth-$c --no-default-features --features scaffold --lib || exit 1
done
"""
[tasks.ci]
depends = ["build", "lint", "test", "scaffold"]
