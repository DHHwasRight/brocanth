[tools]
# Matches the depoth ecosystem: rsx's proc-macro artifacts are not compatible
# across patch releases.
# rustfmt and clippy: the gate runs both, and module tests pipe generated
# code through rustfmt.
rust = { version = "1.98", components = "rustfmt,clippy" }
# The test runner (`mise run test`, CI). The aqua backend checks each
# download against the release's own `.sha256` file; mise.lock pins the
# hash per platform. Bump the version here, then run `mise lock` and check
# the new hashes against the release's `.sha256` files.
cargo-nextest = "0.9.152"

[tasks.build]
run = "cargo build --workspace"
# nextest runs the tests in parallel, each in its own process; its groups
# (.config/nextest.toml) serialise the tests that share state. It does not
# run doctests, so cargo runs them after.
[tasks.test]
run = ["cargo nextest run --workspace", "cargo test --workspace --doc"]
# The tests that start a real embedded Postgres. They skip when the archive
# is not on the machine; this lets them download it once (GitHub, see
# docs/modules/db-embedded.md). The second run bundles that archive into the
# test binary (`BROCANTH_POSTGRES_BUNDLE`): build.rs checks it against the
# pin, and the production tests start from the bundled bytes.
[tasks.embedded]
run = '''
set -e
export BROCANTH_EMBEDDED_TEST=1
cargo test -p brocanth-db --features embedded --test embedded
version=$(sed -n 's/^pub const POSTGRES_VERSION: &str = "\(.*\)";/\1/p' crates/brocanth-db/src/embedded_pins.rs)
host=$(rustc -vV | sed -n 's/^host: //p')
archive="$HOME/.theseus/postgresql/postgresql-$version-$host.tar.gz"
test -f "$archive" || { echo "embedded: no archive at $archive after the first run" >&2; exit 1; }
BROCANTH_POSTGRES_BUNDLE="$archive" cargo test -p brocanth-db --features embedded --test embedded
'''
[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"
# Every module crate as the CLI takes it: the scaffold side alone, with the
# runtime off. Its own tests run too; doctests are the runtime's and stay in
# `test`. The list is every crate with a `scaffold` feature, read from the
# manifests, so a new module crate cannot be left out.
[tasks.scaffold]
run = """
for toml in crates/*/Cargo.toml; do
  grep -q '^scaffold *=' "$toml" || continue
  c=$(basename "$(dirname "$toml")")
  cargo test -p "$c" --no-default-features --features scaffold --lib || exit 1
done
"""
# Generated projects, built and tested: each crate test that calls
# `brocanth_scaffold::testing::build`, then the CLI's golden shapes. This
# takes many minutes. The crate tests use one target directory, so the
# framework compiles once. They run one after another: two processes must not
# share that directory. The golden shapes then build on
# `BROCANTH_SHAPES_JOBS` workers (default: 2, or a third of the cores if that
# is fewer): worker 0 in that directory, worker i in `<it>/w<i>`.
[tasks.generated]
run = """
# Absolute: cargo runs in each project's own directory.
export BROCANTH_BUILD=1 BROCANTH_BUILD_TARGET="$PWD/target/generated"
# Every test runs; a failure is collected, not fatal, so one broken crate
# does not hide the next. The task fails at the end if any test failed.
failed=""
for test in $(grep -l 'testing::build' crates/*/tests/*.rs); do
  c=$(echo "$test" | cut -d/ -f2)
  t=$(basename "$test" .rs)
  cargo test -p "$c" --test "$t" || failed="$failed $c:$t"
done
cargo test -p brocanth-cli --bin brocanth -- --ignored the_golden_shapes_build_and_pass_their_own_tests \
  || failed="$failed brocanth-cli:the_golden_shapes_build_and_pass_their_own_tests"
if [ -n "$failed" ]; then
  echo "generated: these tests failed:" >&2
  for f in $failed; do echo "  $f" >&2; done
  exit 1
fi
"""
[tasks.ci]
depends = ["build", "lint", "test", "scaffold", "generated"]
