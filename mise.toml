[tools]
# Matches the depoth ecosystem: rsx's proc-macro artifacts are not compatible
# across patch releases.
rust = "1.98"

[tasks.build]
run = "cargo build --workspace"
[tasks.test]
run = "cargo test --workspace"
[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"
# Every module crate as the CLI takes it: the scaffold side alone, with the
# runtime off. Its own tests run too; doctests are the runtime's and stay in
# `test`. The list is every crate with a `scaffold` feature, read from the
# manifests, so a new module crate cannot be left out.
[tasks.scaffold]
run = """
for toml in crates/*/Cargo.toml; do
  grep -q '^scaffold *=' "$toml" || continue
  c=$(basename "$(dirname "$toml")")
  cargo test -p "$c" --no-default-features --features scaffold --lib || exit 1
done
"""
# Generated projects, built and tested: each crate test that calls
# `brocanth_scaffold::testing::build`, then the CLI's golden shapes. This
# takes many minutes. All projects use one target directory, so the framework
# compiles once. The runs are sequential: two processes must not share that
# directory.
[tasks.generated]
run = """
# Absolute: cargo runs in each project's own directory.
export BROCANTH_BUILD=1 BROCANTH_BUILD_TARGET="$PWD/target/generated"
for test in $(grep -l 'testing::build' crates/*/tests/*.rs); do
  c=$(echo "$test" | cut -d/ -f2)
  cargo test -p "$c" --test "$(basename "$test" .rs)" || exit 1
done
cargo test -p brocanth-cli --bin brocanth -- --ignored the_golden_shapes_build_and_pass_their_own_tests
"""
[tasks.ci]
depends = ["build", "lint", "test", "scaffold", "generated"]
