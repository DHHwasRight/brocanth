# The project gate (CLAUDE.md "Commands"), on GitHub Actions.
#
# Every push to main and every pull request runs lint, test, scaffold and
# database. `generated` builds and tests generated projects; it takes many
# minutes, so it runs on a push to main, every night and on demand, not on
# each pull request. The nightly run also starts the embedded Postgres
# tests, which download a Postgres archive.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      - uses: jdx/mise-action@v2
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # No database is set, so the Postgres tests skip; the `database` job
      # runs them. mise installs cargo-nextest from mise.toml, checked
      # against the hash in mise.lock. nextest does not run doctests, so
      # cargo runs them in their own step.
      - name: tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: doctests
        run: cargo test --workspace --doc --locked --no-fail-fast

  scaffold:
    name: scaffold side of each module
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scaffold
      - run: mise run scaffold

  database:
    name: Postgres and Redis tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brocanth
          POSTGRES_PASSWORD: brocanth
          POSTGRES_DB: brocanth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brocanth"
          --health-interval 5s --health-timeout 5s --health-retries 20
      queue:
        image: postgres:16
        env:
          POSTGRES_USER: brocanth
          POSTGRES_PASSWORD: brocanth
          POSTGRES_DB: queue
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U brocanth"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BROCANTH_TEST_DATABASE_URL: postgres://brocanth:brocanth@localhost:5432/brocanth
      # A database of its own: its tests clear the shared `queue_*` tables
      # under a lock that only one process holds.
      BROCANTH_QUEUE_TEST_DATABASE_URL: postgres://brocanth:brocanth@localhost:5433/queue
      BROCANTH_QUEUE_REQUIRE_POSTGRES: "1"
      BROCANTH_CACHE_TEST_REDIS: redis://localhost:6379
      # The object store conformance runs (docs/object-storage.md §7).
      BROCANTH_STORAGE_TEST_S3: http://minioadmin:minioadmin@localhost:9000/brocanth-test
      BROCANTH_STORAGE_TEST_GCS: http://localhost:4443/brocanth-test
      # The crates whose tests read the variables above.
      DB_CRATES: >-
        brocanth-admin-model brocanth-analytics brocanth-audit
        brocanth-auth brocanth-cache brocanth-cache-redis brocanth-db
        brocanth-filters brocanth-flags brocanth-jobs brocanth-middleware
        brocanth-migrate brocanth-model brocanth-oauth-client
        brocanth-pagination brocanth-policy brocanth-policy-macros
        brocanth-queue-postgres brocanth-resource brocanth-rls
        brocanth-search brocanth-storage brocanth-webhooks
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      # MinIO and a GCS emulator, by digest. `docker run`, not `services`:
      # a service container cannot pass the arguments both need. Bump the
      # tag and the digest together.
      # - pgsty/minio: a community build of MinIO; `minio/minio` images are
      #   no longer published. RELEASE.2026-08-04T00-00-00Z.
      # - tustvold/fake-gcs-server: the fork the object_store project tests
      #   against; upstream fake-gcs-server sends an XML-API PUT to its JSON
      #   upload handler (checked on 1.52.2 and on 2026-08 latest).
      - name: Start MinIO and the GCS emulator
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          docker run -d --name gcs -p 4443:4443 \
            tustvold/fake-gcs-server@sha256:dcd3aeacc07c731f1336e90c2889be2af8626ae993ee1fe2c0ba042ebbeb5a04 \
            -scheme http -backend memory -public-host localhost:4443
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          # The S3 suite needs its bucket; the GCS suite makes its own.
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user minioadmin:minioadmin \
            -X PUT http://localhost:9000/brocanth-test
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: database
      # The crates in DB_CRATES, with every feature (the `postgres` tests
      # of cache and storage sit behind one, and the S3 and GCS runs of
      # storage behind `s3` and `gcs`).
      # nextest runs them in parallel; the groups in .config/nextest.toml
      # serialise the queue tests (CLAUDE.md "Tests"). The embedded
      # Postgres tests skip without BROCANTH_EMBEDDED_TEST; the nightly job
      # runs them.
      - name: database tests
        run: cargo nextest run --all-features --locked --profile ci $(printf -- '-p %s ' $DB_CRATES)
      # The doctests of the same crates, with the same features.
      - name: database doctests
        run: cargo test --doc --all-features --locked --no-fail-fast $(printf -- '-p %s ' $DB_CRATES)

  generated:
    name: generated projects
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: generated
          # The generated projects share target/generated.
          workspaces: |
            . -> target
            . -> target/generated
      # Two shape workers: each has its own target directory of several
      # gigabytes, and a standard runner has about 14 GB free.
      - run: mise run generated
        env:
          BROCANTH_SHAPES_JOBS: "2"

  embedded:
    name: embedded Postgres
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # `zod` is a workspace dependency on ../zod (a sibling repository).
      - name: Check out zod beside brocanth
        run: git clone --depth 1 https://github.com/DHHwasRight/zod.git ../zod
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded
      # rust-cache saves `target/` with every file removed under a directory
      # that is not a cargo profile, and every directory kept. The embedded
      # tests keep their servers under `target/tmp`, so a cache hit gives
      # back `data/` and `server/` as trees of empty directories, and each
      # start fails with "has files but no cluster". Start them from nothing.
      - name: Remove the embedded servers a cache gave back
        run: rm -rf target/tmp
      # Downloads the Postgres archive on its first run
      # (docs/modules/db-embedded.md), then runs the tests again with the
      # archive bundled into the binary: the production tests
      # (docs/embedded-postgres-production.md) start with no file and no
      # network.
      - run: mise run embedded
